spring.application.name=whereisit-api

# Database Configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:whereisit}
spring.datasource.username=${DB_USER:DB_USERNAME}
spring.datasource.password=${DB_PASSWORD:DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA and Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JWT Key Settings
jwt.secret=${JWT_SECRET:CHANGE_ME_set_a_strong_JWT_secret_in_your_dot_env_file_minimum_64_chars}
jwt.expiration=${JWT_EXPIRATION:86400000}

# File Upload Configuration
file.upload-dir=${UPLOAD_DIR:./uploads}

# AI Settings
ai.api-key=${GEMINI_API_KEY:${AI_API_KEY:}}

# Email Configuration (SMTP)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

